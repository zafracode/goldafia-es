<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0a">
    <title>Gold Afiações | Premium</title>

    <!-- Google Fonts: Plus Jakarta Sans para um visual moderno e corporativo -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Phosphor Icons: Ícones profissionais -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* =========================================
           VARIÁVEIS PREMIUM (DARK & GOLD)
        ========================================= */
        :root {
            --gold: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-dark: #997A00;
            --gold-gradient: linear-gradient(135deg, #F3E5AB 0%, #D4AF37 50%, #997A00 100%);
            
            --bg-base: #050505;
            --bg-surface: rgba(20, 20, 20, 0.6);
            --bg-surface-hover: rgba(35, 35, 35, 0.8);
            
            --text-main: #FFFFFF;
            --text-muted: #A1A1AA;
            
            --danger: #EF4444;
            --warning: #F59E0B;
            --success: #10B981;
            
            --glass-border: rgba(212, 175, 55, 0.15);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            --glass-blur: blur(20px);
        }

        /* =========================================
           RESET E BASE
        ========================================= */
        * {
            box-sizing: border-box; margin: 0; padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(212, 175, 55, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(212, 175, 55, 0.08), transparent 25%);
            background-attachment: fixed;
            color: var(--text-main);
            padding-top: env(safe-area-inset-top);
            padding-bottom: calc(100px + env(safe-area-inset-bottom));
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 10px; }

        /* =========================================
           COMPONENTES GLOBAIS
        ========================================= */
        .glass-panel {
            background: var(--bg-surface);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 24px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Cabeçalho */
        header {
            position: sticky; top: 0; z-index: 100;
            padding: calc(20px + env(safe-area-inset-top)) 24px 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .logo {
            font-size: 1.4rem; font-weight: 800; 
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .notification-btn {
            background: none; border: none; font-size: 1.6rem; color: var(--text-main);
            position: relative; cursor: pointer; transition: transform 0.2s;
        }
        .notification-btn:active { transform: scale(0.9); }
        .badge {
            position: absolute; top: -4px; right: -4px; background-color: var(--danger);
            color: white; font-size: 0.65rem; font-weight: 800; border-radius: 50%;
            width: 18px; height: 18px; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.6); border: 2px solid var(--bg-base);
            animation: pulse-danger 2s infinite;
        }

        @keyframes pulse-danger {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* Layout Principal */
        main { max-width: 800px; margin: 24px auto; padding: 0 20px; }
        .section { display: none; animation: fadeSlideUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .section.active { display: block; }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        h2 {
            color: var(--text-main); font-size: 1.5rem; font-weight: 700;
            margin-bottom: 24px; display: flex; align-items: center; gap: 10px;
        }
        h2 i { color: var(--gold); font-size: 1.8rem; }

        /* =========================================
           FORMULÁRIOS E INPUTS
        ========================================= */
        .form-group { margin-bottom: 20px; position: relative; }
        label { 
            display: block; margin-bottom: 8px; font-size: 0.85rem; 
            font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;
        }
        
        input[type="text"], input[type="number"], input[type="tel"], select {
            width: 100%; padding: 16px 20px; font-size: 16px; color: var(--text-main);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
            transition: all 0.3s ease;
        }
        input:focus, select:focus {
            outline: none; border-color: var(--gold); background: rgba(212, 175, 55, 0.05);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
        }
        input::placeholder { color: rgba(255,255,255,0.2); }
        
        button.btn {
            background: var(--gold-gradient); color: var(--bg-base); border: none;
            padding: 18px 24px; font-size: 1.1rem; font-weight: 700; text-transform: uppercase;
            border-radius: 16px; cursor: pointer; width: 100%;
            transition: all 0.3s; box-shadow: 0 8px 20px rgba(212, 175, 55, 0.25);
            position: relative; overflow: hidden;
        }
        button.btn:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(212, 175, 55, 0.4); }
        button.btn:active { transform: translateY(1px); }

        /* Busca */
        .search-bar input { padding-left: 50px; background: rgba(255,255,255,0.05); }
        .search-bar i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); font-size: 1.3rem; color: var(--text-muted); }

        /* =========================================
           CARDS E LISTAS
        ========================================= */
        .cliente-card {
            background: var(--bg-surface); padding: 20px; border-radius: 20px; margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden;
            transition: transform 0.2s, background 0.2s;
        }
        .cliente-card:hover { background: var(--bg-surface-hover); }
        .cliente-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--gold); }
        
        .status-longe::before { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .status-perto::before { background: var(--warning); box-shadow: 0 0 10px var(--warning); }
        .status-atrasado::before { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
        
        .cliente-nome { font-weight: 700; font-size: 1.2rem; color: var(--text-main); }
        .cliente-info { font-size: 0.9rem; color: var(--text-muted); display: flex; align-items: center; justify-content: space-between; }
        .cliente-info span { display: flex; align-items: center; gap: 6px; }
        .cliente-info i { color: var(--gold); font-size: 1.1rem; }

        /* Tabela OS */
        .os-row {
            display: grid; grid-template-columns: 70px 1fr 110px; gap: 12px; align-items: center;
            margin-bottom: 12px; background: rgba(255,255,255,0.02); padding: 12px; border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05); transition: background 0.3s;
        }
        .os-row:focus-within { background: rgba(212, 175, 55, 0.05); border-color: rgba(212, 175, 55, 0.3); }
        .os-row input { padding: 12px; text-align: center; background: rgba(0,0,0,0.3); border: none; }
        
        .os-header { background: none; border: none; padding: 0 12px; margin-bottom: 8px; }
        .os-header div { font-weight: 700; color: var(--gold); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
        .item-name { font-size: 0.95rem; font-weight: 500; }
        
        .total-box {
            background: linear-gradient(145deg, rgba(30,41,59,0.8), rgba(15,23,42,0.9));
            padding: 24px; border-radius: 20px; text-align: right;
            margin-bottom: 24px; border: 1px solid rgba(212, 175, 55, 0.2);
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .total-box strong { color: var(--gold); font-size: 1.8rem; font-weight: 800; letter-spacing: -1px; }

        /* =========================================
           NAVEGAÇÃO INFERIOR
        ========================================= */
        nav {
            position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); 
            left: 50%; transform: translateX(-50%); width: 92%; max-width: 450px;
            background: rgba(15, 15, 15, 0.85); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            display: flex; justify-content: space-around; padding: 10px; border-radius: 30px; z-index: 100;
        }
        .nav-item {
            background: none; border: none; color: var(--text-muted); font-size: 0.75rem; font-weight: 600;
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            cursor: pointer; width: 30%; padding: 10px 0; border-radius: 20px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-item i { font-size: 1.6rem; transition: all 0.3s; }
        .nav-item.active { background: rgba(212, 175, 55, 0.15); color: var(--gold); }
        .nav-item.active i { transform: translateY(-3px) scale(1.1); text-shadow: 0 0 15px rgba(212, 175, 55, 0.5); }

        /* =========================================
           MODAIS E TOASTS
        ========================================= */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: flex-end; z-index: 1000;
            opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content {
            background-color: var(--bg-base); width: 100%; max-width: 600px; max-height: 85vh;
            overflow-y: auto; border-radius: 32px 32px 0 0; padding: 30px 24px 80px; position: relative;
            border-top: 1px solid rgba(255,255,255,0.1);
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        
        .modal-content::before {
            content: ''; position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            width: 40px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 10px;
        }
        
        .close-modal {
            position: absolute; top: 24px; right: 24px; background: rgba(255,255,255,0.1); 
            border: none; color: var(--text-main); width: 36px; height: 36px; border-radius: 50%; 
            font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        .close-modal:hover { background: rgba(255,255,255,0.2); }

        .os-detalhe-header { text-align: center; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px dashed rgba(255,255,255,0.1); }
        .os-detalhe-header h3 { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.6rem; font-weight: 800; letter-spacing: 1px;}
        .os-detalhe-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .os-detalhe-box { background: rgba(255,255,255,0.02); padding: 20px; border-radius: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }

        /* Toast Moderno */
        #toast {
            position: fixed; top: calc(20px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%) translateY(-100px);
            background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(10px); border: 1px solid var(--gold);
            color: var(--text-main); padding: 16px 30px; border-radius: 30px;
            font-weight: 600; font-size: 0.95rem; z-index: 2000; box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
            display: flex; align-items: center; gap: 10px; transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
        #toast i { color: var(--gold); font-size: 1.4rem; }
        
        hr.separador { margin: 40px 0; border: none; border-top: 1px dashed rgba(255,255,255,0.1); }

    </style>
</head>
<body>

    <header>
        <div class="logo">Gold Afiações</div>
        <button class="notification-btn" onclick="abrirTelaNotificacoes()">
            <i class="ph-fill ph-bell"></i>
            <span class="badge" id="notificacao-badge">0</span>
        </button>
    </header>

    <main>
        <!-- SEÇÃO: NOVO SERVIÇO -->
        <section id="sec-servico" class="section active">
            <h2><i class="ph-duotone ph-wrench"></i> Nova Ordem de Serviço</h2>
            
            <div class="glass-panel" style="padding: 24px; margin-bottom: 24px;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="os-cliente">Selecione o Cliente</label>
                    <select id="os-cliente">
                        <option value="">Cadastre um cliente primeiro...</option>
                    </select>
                </div>
            </div>

            <div class="os-table-container" id="os-itens-container">
                <div class="os-row os-header">
                    <div>QTD</div>
                    <div>Item / Especificação</div>
                    <div>VAL UN (R$)</div>
                </div>
                <!-- Injetado via JS -->
            </div>

            <div class="total-box">
                <div>
                    <span style="font-weight: 600; color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase;">Total da OS</span>
                </div>
                <strong id="os-total">R$ 0,00</strong>
            </div>

            <button class="btn" onclick="salvarServico()">
                <i class="ph-bold ph-check-circle" style="vertical-align: middle; margin-right: 8px; font-size: 1.3rem;"></i> Finalizar Serviço
            </button>
        </section>

        <!-- SEÇÃO: CLIENTES -->
        <section id="sec-clientes" class="section">
            <h2><i class="ph-duotone ph-user-plus"></i> Novo Cliente</h2>
            <div class="glass-panel" style="padding: 24px; margin-bottom: 30px;">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="cli-nome" placeholder="Ex: Maria Silva">
                </div>
                <div class="form-group">
                    <label>WhatsApp / Telefone</label>
                    <input type="tel" id="cli-telefone" placeholder="(00) 00000-0000" oninput="maskPhone(this)">
                </div>
                <div class="form-group">
                    <label>Endereço Completo</label>
                    <input type="text" id="cli-endereco" placeholder="Rua, Nº, Bairro...">
                </div>
                <div class="form-group">
                    <label>Ciclo de Manutenção (Dias)</label>
                    <input type="number" id="cli-retorno" value="30" placeholder="Ex: 30">
                </div>
                <button class="btn" onclick="salvarCliente()" style="margin-top: 10px;">Salvar Cliente</button>
            </div>

            <h2><i class="ph-duotone ph-users"></i> Carteira de Clientes</h2>
            <div class="search-bar form-group">
                <i class="ph ph-magnifying-glass"></i>
                <input type="text" id="busca-cliente" placeholder="Buscar cliente..." oninput="filtrarClientes()">
            </div>
            <div id="lista-clientes-container"></div>
        </section>

        <!-- SEÇÃO: HISTÓRICO -->
        <section id="sec-historico" class="section">
            <h2><i class="ph-duotone ph-clock-counter-clockwise"></i> Histórico de OS</h2>
            <div id="lista-historico"></div>
        </section>

        <!-- SEÇÃO: NOTIFICAÇÕES -->
        <section id="sec-notificacoes" class="section">
            <h2><i class="ph-duotone ph-chart-line-up"></i> Painel de Retornos</h2>
            <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 24px; background: var(--bg-surface); padding: 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05);">
                Acompanhe o ciclo de afiação. <br>
                <span style="color:var(--success)">🟢 No prazo</span> | <span style="color:var(--warning)">🟠 Próximo</span> | <span style="color:var(--danger)">🔴 Atrasado</span>
            </p>
            <div id="lista-tela-notificacoes"></div>
        </section>
    </main>

    <!-- MENU INFERIOR -->
    <nav>
        <button class="nav-item active" onclick="mudarAba('sec-servico', this)">
            <i class="ph-fill ph-wrench"></i>
            <span>Serviço</span>
        </button>
        <button class="nav-item" onclick="mudarAba('sec-clientes', this)">
            <i class="ph-fill ph-users"></i>
            <span>Clientes</span>
        </button>
        <button class="nav-item" onclick="mudarAba('sec-historico', this)">
            <i class="ph-fill ph-receipt"></i>
            <span>Histórico</span>
        </button>
    </nav>

    <!-- MODAL DETALHES OS -->
    <div class="modal-overlay" id="modal-os" onclick="fecharModalFora(event)">
        <div class="modal-content" id="modal-os-content">
            <button class="close-modal" onclick="fecharModal('modal-os')"><i class="ph-bold ph-x"></i></button>
            <div class="os-detalhe-header">
                <h3>Gold AFIAÇÕES</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 5px; text-transform: uppercase; letter-spacing: 2px;">Recibo de Serviço</p>
            </div>
            <div id="detalhes-os-conteudo"></div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast"><i class="ph-fill ph-check-circle"></i> <span id="toast-msg">Sucesso!</span></div>

    <script>
        // --- BANCO DE DADOS ---
        let clientes = JSON.parse(localStorage.getItem('gold_clientes_v2')) || [];
        let servicos = JSON.parse(localStorage.getItem('gold_servicos_v2')) || [];
        let precosSalvos = JSON.parse(localStorage.getItem('gold_precos_v2')) || {};

        const listaItensOficiais = [
            { id: 'gravacao', nome: 'Gravação de Nome', tipo: 'texto' },
            { id: 'alicate-cuticula', nome: 'Alicate Cutícula', tipo: 'numero' },
            { id: 'alicate-unha', nome: 'Alicate Unha', tipo: 'numero' },
            { id: 'molas-parafuso', nome: 'Molas / Parafuso', tipo: 'numero' },
            { id: 'espatula-raspador', nome: 'Espátula / Palito', tipo: 'numero' },
            { id: 'bisturi', nome: 'Bisturi', tipo: 'numero' },
            { id: 'tesoura', nome: 'Tesoura', tipo: 'numero' },
            { id: 'lamina-maq', nome: 'Lâmina Máquina', tipo: 'numero' },
            { id: 'faca', nome: 'Faca', tipo: 'numero' },
            { id: 'frete', nome: 'Taxa de Entrega', tipo: 'numero' },
            { id: 'outros', nome: 'Outros Serviços', tipo: 'numero' }
        ];

        // --- UTILITÁRIOS ---
        const formatarMoeda = (valor) => {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor);
        };

        const maskPhone = (input) => {
            let val = input.value.replace(/\D/g, '');
            if(val.length > 11) val = val.slice(0, 11);
            if(val.length > 2) val = `(${val.slice(0,2)}) ${val.slice(2)}`;
            if(val.length > 10) val = `${val.slice(0,10)}-${val.slice(10)}`;
            input.value = val;
        };

        const mostrarToast = (msg) => {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        };

        // --- INICIALIZAÇÃO ---
        window.onload = () => {
            renderizarFormularioItens();
            atualizarSelectClientes();
            renderizarListaClientes();
            renderizarHistorico();
            atualizarSinoNotificacoes();
        };

        // --- NAVEGAÇÃO ---
        function mudarAba(idAba, elementoBotao) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            document.getElementById(idAba).classList.add('active');
            
            if(elementoBotao) elementoBotao.classList.add('active');
            if(idAba === 'sec-historico') renderizarHistorico();
            if(idAba === 'sec-clientes') renderizarListaClientes();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- PREÇOS E OS ---
        function atualizarPrecoFixo(id, valor) {
            precosSalvos[id] = parseFloat(valor) || 0;
            localStorage.setItem('gold_precos_v2', JSON.stringify(precosSalvos));
            calcularTotal();
        }

        function renderizarFormularioItens() {
            const container = document.getElementById('os-itens-container');
            
            listaItensOficiais.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'os-row';
                row.style.animation = `fadeSlideUp 0.4s ease forwards ${index * 0.05}s`;
                row.style.opacity = '0';
                
                let precoAtual = precosSalvos[item.id] !== undefined ? precosSalvos[item.id] : '';

                if (item.tipo === 'texto') {
                    row.innerHTML = `
                        <div><input type="text" id="qtd_${item.id}" placeholder="Nome" oninput="calcularTotal()"></div>
                        <div class="item-name">${item.nome}</div>
                        <div><input type="number" id="val_${item.id}" min="0" step="0.01" value="${precoAtual}" placeholder="0,00" oninput="atualizarPrecoFixo('${item.id}', this.value)"></div>
                    `;
                } else {
                    row.innerHTML = `
                        <div><input type="number" id="qtd_${item.id}" min="0" placeholder="0" oninput="calcularTotal()"></div>
                        <div class="item-name">${item.nome}</div>
                        <div><input type="number" id="val_${item.id}" min="0" step="0.01" value="${precoAtual}" placeholder="0,00" oninput="atualizarPrecoFixo('${item.id}', this.value)"></div>
                    `;
                }
                container.appendChild(row);
            });
        }

        function animarNumero(id, valorFinal) {
            const elemento = document.getElementById(id);
            elemento.innerText = formatarMoeda(valorFinal);
            elemento.style.transform = 'scale(1.1)';
            elemento.style.color = '#FFF';
            setTimeout(() => {
                elemento.style.transform = 'scale(1)';
                elemento.style.color = 'var(--gold)';
            }, 150);
        }

        function calcularTotal() {
            let totalGeral = 0;
            listaItensOficiais.forEach(item => {
                const inputQtd = document.getElementById(`qtd_${item.id}`);
                const inputVal = document.getElementById(`val_${item.id}`);
                let quantidade = item.tipo === 'texto' ? (inputQtd.value.trim() !== '' ? 1 : 0) : (parseInt(inputQtd.value) || 0);
                let precoUnitario = parseFloat(inputVal.value) || 0;
                totalGeral += (quantidade * precoUnitario);
            });
            animarNumero('os-total', totalGeral);
        }

        function salvarServico() {
            const clienteId = document.getElementById('os-cliente').value;
            if (!clienteId) { alert("⚠️ Selecione um cliente."); return; }

            let itensAdicionados = [];
            let totalServico = 0;

            listaItensOficiais.forEach(item => {
                const inputQtd = document.getElementById(`qtd_${item.id}`);
                const inputVal = document.getElementById(`val_${item.id}`);
                
                let quantidade = item.tipo === 'texto' ? (inputQtd.value.trim() !== '' ? 1 : 0) : (parseInt(inputQtd.value) || 0);
                let precoUnitario = parseFloat(inputVal.value) || 0;
                
                if (quantidade > 0) {
                    let totalItem = quantidade * precoUnitario;
                    itensAdicionados.push({ nome: item.nome, qtdValor: item.tipo === 'texto' ? inputQtd.value : quantidade, valorUnitario: precoUnitario, valorTotal: totalItem });
                    totalServico += totalItem;
                }
            });

            if (itensAdicionados.length === 0) { alert("⚠️ Insira a quantidade de pelo menos um item."); return; }

            const dataAtual = new Date();
            servicos.push({
                id: Date.now().toString(), clienteId, itens: itensAdicionados, total: totalServico,
                dataStr: dataAtual.toLocaleDateString('pt-BR'), horaStr: dataAtual.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
                timestamp: dataAtual.getTime()
            });
            localStorage.setItem('gold_servicos_v2', JSON.stringify(servicos));

            listaItensOficiais.forEach(item => document.getElementById(`qtd_${item.id}`).value = '');
            document.getElementById('os-cliente').value = '';
            document.getElementById('os-total').innerText = 'R$ 0,00';

            mostrarToast("OS Gerada com Sucesso!");
            atualizarSinoNotificacoes(); 
        }

        // --- CLIENTES ---
        function salvarCliente() {
            const nome = document.getElementById('cli-nome').value.trim();
            const telefone = document.getElementById('cli-telefone').value.trim();
            const endereco = document.getElementById('cli-endereco').value.trim();
            const retorno = parseInt(document.getElementById('cli-retorno').value) || 30;

            if (!nome) { alert("⚠️ O nome do cliente é obrigatório."); return; }

            clientes.push({ id: Date.now().toString(), nome, telefone, endereco, retornoDias: retorno, dataCadastro: new Date().toISOString() });
            localStorage.setItem('gold_clientes_v2', JSON.stringify(clientes));
            
            document.getElementById('cli-nome').value = ''; document.getElementById('cli-telefone').value = '';
            document.getElementById('cli-endereco').value = ''; document.getElementById('cli-retorno').value = '30';
            
            atualizarSelectClientes(); renderizarListaClientes();
            mostrarToast("Cliente Cadastrado!");
        }

        function atualizarSelectClientes() {
            const select = document.getElementById('os-cliente');
            select.innerHTML = '<option value="">Selecione um cliente...</option>';
            clientes.sort((a, b) => a.nome.localeCompare(b.nome)).forEach(cli => {
                select.innerHTML += `<option value="${cli.id}">${cli.nome}</option>`;
            });
        }

        function renderizarListaClientes(termoBusca = '') {
            const container = document.getElementById('lista-clientes-container');
            container.innerHTML = '';
            const termo = termoBusca.toLowerCase().trim();
            const filtrados = clientes.filter(cli => cli.nome.toLowerCase().includes(termo) || (cli.telefone && cli.telefone.toLowerCase().includes(termo)));

            if (filtrados.length === 0) return container.innerHTML = '<p style="color: var(--text-muted); text-align:center; padding: 20px;">Nenhum cliente encontrado.</p>';

            filtrados.sort((a, b) => a.nome.localeCompare(b.nome)).forEach(cli => {
                container.innerHTML += `
                    <div class="cliente-card">
                        <div class="cliente-nome">${cli.nome}</div>
                        <div style="height: 1px; background: rgba(255,255,255,0.05); margin: 5px 0;"></div>
                        <div class="cliente-info"><span><i class="ph ph-whatsapp-logo"></i> ${cli.telefone || '-'}</span> <span><i class="ph ph-arrows-clockwise"></i> <strong style="color:var(--gold)">${cli.retornoDias} dias</strong></span></div>
                        <div class="cliente-info" style="margin-top: 5px;"><span><i class="ph ph-map-pin"></i> ${cli.endereco || 'Endereço não informado'}</span></div>
                    </div>`;
            });
        }
        function filtrarClientes() { renderizarListaClientes(document.getElementById('busca-cliente').value); }

        // --- HISTÓRICO ---
        function renderizarHistorico() {
            const container = document.getElementById('lista-historico');
            container.innerHTML = '';
            if (servicos.length === 0) return container.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding: 20px;">Nenhuma OS registrada.</p>';

            [...servicos].sort((a, b) => b.timestamp - a.timestamp).forEach((serv, index) => {
                const cliente = clientes.find(c => c.id === serv.clienteId) || { nome: 'Cliente Excluído' };
                container.innerHTML += `
                    <div class="cliente-card" onclick="abrirModalOS('${serv.id}')" style="cursor:pointer; animation: fadeSlideUp 0.4s ease forwards ${index * 0.05}s; opacity:0;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span class="cliente-nome">${cliente.nome}</span>
                            <span style="color: var(--text-muted); font-size: 0.8rem; background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 12px;">${serv.dataStr}</span>
                        </div>
                        <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-top: 10px;">
                            <span style="color:var(--gold); font-size:0.85rem;"><i class="ph ph-magnifying-glass-plus"></i> Ver recibo</span>
                            <div style="color:var(--text-main); font-weight:800; font-size:1.3rem;">${formatarMoeda(serv.total)}</div>
                        </div>
                    </div>`;
            });
        }

        // --- MODAL & NOTIFICAÇÕES ---
        function abrirModalOS(id) {
            const serv = servicos.find(s => s.id === id);
            const cli = clientes.find(c => c.id === serv.clienteId) || { nome: 'Desconhecido', telefone: '-' };
            
            let html = `
                <div style="margin-bottom:24px;font-size:0.95rem; background: rgba(212, 175, 55, 0.05); border: 1px solid rgba(212, 175, 55, 0.2); padding: 16px; border-radius: 16px;">
                    <p style="margin-bottom:8px; display:flex; justify-content:space-between;"><strong>Cliente:</strong> <span>${cli.nome}</span></p>
                    <p style="display:flex; justify-content:space-between; color: var(--text-muted);"><strong>Emissão:</strong> <span>${serv.dataStr} às ${serv.horaStr}</span></p>
                </div>
                <div class="os-detalhe-box">
                    <div style="display:flex; justify-content:space-between; font-weight:700; margin-bottom:15px; color:var(--gold); border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px; font-size:0.8rem; text-transform:uppercase;">
                        <span style="width:40px;">Qtd</span><span style="flex-grow:1;">Descrição</span><span>Total</span>
                    </div>`;
            serv.itens.forEach(item => {
                html += `<div class="os-detalhe-item"><span style="width:40px; font-weight:600;">${item.qtdValor}</span><span style="flex-grow:1; color: var(--text-muted);">${item.nome}</span><span style="font-weight:700;">${formatarMoeda(item.valorTotal)}</span></div>`;
            });
            html += `</div><div style="text-align:right;font-size:1.6rem;font-weight:800; margin-top:24px;">TOTAL: <span style="color:var(--gold);">${formatarMoeda(serv.total)}</span></div>`;
            
            document.getElementById('detalhes-os-conteudo').innerHTML = html;
            document.getElementById('modal-os').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function obterStatusClientes() {
            const agora = new Date().getTime();
            let listaStatus = [];

            clientes.forEach(cliente => {
                const servsCli = servicos.filter(s => s.clienteId === cliente.id);
                if (servsCli.length > 0) {
                    const dataBase = Math.max(...servsCli.map(s => s.timestamp));
                    const vencimento = dataBase + (cliente.retornoDias * 24 * 60 * 60 * 1000);
                    const diasRestantes = Math.ceil((vencimento - agora) / (1000 * 60 * 60 * 24));
                    listaStatus.push({ cliente, diasRestantes, vencimento });
                }
            });
            return listaStatus;
        }

        function atualizarSinoNotificacoes() {
            const status = obterStatusClientes();
            const atrasados = status.filter(s => s.diasRestantes <= 0).length;
            const badge = document.getElementById('notificacao-badge');
            badge.innerText = atrasados;
            badge.style.display = atrasados > 0 ? 'flex' : 'none';
        }

        function abrirTelaNotificacoes() {
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            mudarAba('sec-notificacoes', null);
            
            const listaHtml = document.getElementById('lista-tela-notificacoes');
            listaHtml.innerHTML = '';
            
            let statusClientes = obterStatusClientes().sort((a, b) => a.diasRestantes - b.diasRestantes);

            if (statusClientes.length === 0) {
                return listaHtml.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding: 30px;">Nenhum histórico de afiação.</p>';
            }

            statusClientes.forEach((item, index) => {
                let corClasse = 'status-longe';
                let textoDias = `Faltam ${item.diasRestantes} dias`;
                let corTexto = 'var(--success)';
                let icon = 'ph-check-circle';

                if (item.diasRestantes <= 5 && item.diasRestantes > 0) {
                    corClasse = 'status-perto'; corTexto = 'var(--warning)'; icon = 'ph-warning';
                } else if (item.diasRestantes <= 0) {
                    corClasse = 'status-atrasado'; 
                    textoDias = item.diasRestantes === 0 ? 'VENCE HOJE!' : `ATRASADO (${Math.abs(item.diasRestantes)} dias)`;
                    corTexto = 'var(--danger)'; icon = 'ph-warning-circle';
                }

                listaHtml.innerHTML += `
                    <div class="cliente-card ${corClasse}" style="animation: fadeSlideUp 0.4s ease forwards ${index * 0.05}s; opacity:0;">
                        <div class="cliente-info" style="margin-bottom: 8px;">
                            <span class="cliente-nome" style="color: var(--text-main); font-size:1.1rem;">${item.cliente.nome}</span>
                            <strong style="color: ${corTexto}; font-size: 0.9rem; background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 12px; display:flex; align-items:center; gap:5px;"><i class="ph-fill ${icon}"></i> ${textoDias}</strong>
                        </div>
                        <div class="cliente-info" style="font-size:0.85rem;">
                            <span><i class="ph ph-whatsapp-logo"></i> ${item.cliente.telefone || '-'}</span>
                            <span>Retorno est.: <strong style="color:var(--text-main)">${new Date(item.vencimento).toLocaleDateString('pt-BR')}</strong></span>
                        </div>
                    </div>`;
            });
        }

        function fecharModal(idModal) { 
            document.getElementById(idModal).classList.remove('active'); 
            document.body.style.overflow = 'auto';
        }
        function fecharModalFora(event) { if (event.target.id === 'modal-os') fecharModal('modal-os'); }
    </script>
</body>
</html>
